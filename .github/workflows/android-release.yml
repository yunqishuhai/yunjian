name: Prepare Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, for example v0.3.2'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  privacy:
    uses: ./.github/workflows/privacy.yml
  prepare:
    needs: privacy
    if: github.event_name == 'workflow_dispatch' || vars.CI_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check the exact source snapshot before decoding signing secrets
        run: node tools/audit-public-source.mjs
      - name: Validate tag and signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re, base64
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Use a stable vX.Y.Z tag')
          for name in ['KEYSTORE_BASE64','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD']:
              if not os.environ.get(name):
                  raise SystemExit('Required release signing secrets are missing')
          key = Path(os.environ['RUNNER_TEMP']) / 'yunjian-release.p12'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_VERSION=' + tag[1:] + '\n')
          PY
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and test signed release
        env:
          YUNJIAN_STORE_FILE: ${{ runner.temp }}/yunjian-release.p12
          YUNJIAN_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          YUNJIAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YUNJIAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --console plain \
            -Prelease.versionName="$RELEASE_VERSION" -Prelease.repository="$GITHUB_REPOSITORY"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          node tools/package-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yunjian-${{ env.RELEASE_VERSION }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Prepare draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            node -e 'const fs=require("fs"); if(!JSON.parse(fs.readFileSync(process.argv[1])).isDraft) throw Error("Refusing to overwrite a published release")' "$RUNNER_TEMP/release-state.json"
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --draft --verify-tag \
              --title "云笺 $RELEASE_VERSION" --generate-notes
          fi
      - name: Remove private signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/yunjian-release.p12"
